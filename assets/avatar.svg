<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Circle -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGlow)"/>

  <!-- Tech Grid Background Hexagon -->
  <polygon points="250,50 420,150 420,350 250,450 80,350 80,150" 
           fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Inner Orbit Rings -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="140" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="3"/>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders / Hoodie -->
  <path d="M165 375 C165 305, 195 285, 250 285 C305 285, 335 305, 335 375 Z" fill="#1e293b"/>
  <path d="M200 375 L225 305 L275 305 L300 375 Z" fill="#334155"/>
  <!-- Hoodie Strings / Collar detail -->
  <path d="M230 305 L235 350" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M270 305 L265 350" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="235" y="240" width="30" height="35" rx="5" fill="#fbcfe8"/>

  <!-- Head -->
  <ellipse cx="250" cy="215" rx="42" ry="48" fill="#fed7aa"/>

  <!-- Hair (Modern CSE student style) -->
  <path d="M205 210 C205 165, 230 155, 255 155 C285 155, 295 175, 295 205 C295 215, 290 220, 285 220 C280 200, 270 190, 250 190 C235 190, 220 198, 215 215 Z" fill="#1e1e2f"/>

  <!-- Glasses (Stylish developer glasses) -->
  <rect x="220" y="202" width="24" height="16" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="256" y="202" width="24" height="16" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="244" y1="210" x2="256" y2="210" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Glasses lens reflection -->
  <line x1="223" y1="205" x2="232" y2="214" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="259" y1="205" x2="268" y2="214" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Friendly smile -->
  <path d="M242 238 Q250 245 258 238" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating Coding Badges / Tech Chips -->
  <!-- Chip 1: Java (Top Right) -->
  <g transform="translate(355, 110)">
    <rect width="84" height="34" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" filter="url(#glow)"/>
    <text x="42" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;Java/&gt;</text>
  </g>

  <!-- Chip 2: Python (Top Left) -->
  <g transform="translate(60, 120)">
    <rect width="88" height="34" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="44" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#e2e8f0" text-anchor="middle"># Python</text>
  </g>

  <!-- Chip 3: C / DSA (Bottom Left) -->
  <g transform="translate(55, 340)">
    <rect width="90" height="34" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="45" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">{ C &amp; DSA }</text>
  </g>

  <!-- Chip 4: Web (Bottom Right) -->
  <g transform="translate(350, 330)">
    <rect width="95" height="34" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="47" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">&lt;Web/JS&gt;</text>
  </g>

  <!-- Ambient Pulsing Dots -->
  <circle cx="210" cy="95" r="4" fill="#38bdf8"/>
  <circle cx="390" cy="240" r="5" fill="#a855f7"/>
  <circle cx="105" cy="230" r="4.5" fill="#6366f1"/>
  <circle cx="295" cy="410" r="4" fill="#10b981"/>
</svg>
